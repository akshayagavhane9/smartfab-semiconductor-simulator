
name: SmartFab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: smartfab
          POSTGRES_PASSWORD: smartfab_ci_only
          POSTGRES_DB: smartfab_db

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U smartfab -d smartfab_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: smartfab
      POSTGRES_PASSWORD: smartfab_ci_only
      POSTGRES_DB: smartfab_db
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create isolated test database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U smartfab -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE smartfab_test_db;"

      - name: Run backend integration tests
        working-directory: backend
        run: python -m pytest -v tests/

  frontend-checks:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build
